{% extends 'base.html' %}
{% block title %}Edit Event{% endblock %}
{% block content %}
<div class="back-nav-shell mb-3">
    <button class="btn btn-sm btn-outline-secondary back-btn" type="button" data-fallback-url="{{ url_for('owner.events') }}">
        <i class="bi bi-arrow-left me-2"></i>Back
    </button>
</div>
<div class="glass-card p-4">
    <div class="page-header mb-4">
        <div>
            <h4 class="fw-bold mb-1">Edit Event</h4>
            <p class="text-muted mb-0 small">Update event details and participant limits.</p>
        </div>
        <a class="btn btn-secondary" href="{{ url_for('owner.events') }}">Back to events</a>
    </div>

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Title</label>
                <input name="title" class="form-control" required value="{{ event.title }}" />
            </div>
            <div class="col-md-6">
                <label class="form-label">Event type</label>
                <input name="event_type" class="form-control" value="{{ event.event_type }}" />
            </div>
        </div>

        <div class="mb-3 mt-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="4">{{ event.description }}</textarea>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Start date</label>
                <input name="start_date" class="form-control" type="datetime-local" value="{{ event.start_date.strftime('%Y-%m-%dT%H:%M') if event.start_date else '' }}" />
            </div>
            <div class="col-md-6">
                <label class="form-label">End date</label>
                <input name="end_date" class="form-control" type="datetime-local" value="{{ event.end_date.strftime('%Y-%m-%dT%H:%M') if event.end_date else '' }}" />
            </div>
        </div>

        <div class="row g-3 mt-3">
            <div class="col-md-6">
                <label class="form-label">Location</label>
                <input name="location" class="form-control" value="{{ event.location }}" />
            </div>
            <div class="col-md-3">
                <label class="form-label">Max capacity</label>
                <input name="max_capacity" class="form-control" type="number" min="1" value="{{ event.max_capacity }}" />
            </div>
            <div class="col-md-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="Active" {% if event.status == 'Active' %}selected{% endif %}>Active</option>
                    <option value="Cancelled" {% if event.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                    <option value="Completed" {% if event.status == 'Completed' %}selected{% endif %}>Completed</option>
                </select>
            </div>
        </div>

        <div class="mt-4">
            <button class="btn btn-primary">Save changes</button>
        </div>
    </form>
</div>
{% endblock %}
