{% extends 'base.html' %}
{% block title %}Create Notice{% endblock %}
{% block content %}
<div class="back-nav-shell mb-3">
    <button class="btn btn-sm btn-outline-secondary back-btn" type="button" data-fallback-url="{{ url_for('main.dashboard') }}">
        <i class="bi bi-arrow-left me-2"></i>Back
    </button>
</div>
<div class="glass-card p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1">Create Notice</h4>
            <p class="text-muted small mb-0">Compose a message for residents.</p>
        </div>
        <a class="btn btn-outline-secondary" href="{{ url_for('owner.notices') }}">Back to Notices</a>
    </div>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input class="form-control" name="title" required />
        </div>
        <div class="mb-3">
            <label class="form-label">Content</label>
            <textarea class="form-control" name="content" rows="5" required></textarea>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label">Type</label>
                <select class="form-select" name="notice_type">
                    <option>General</option>
                    <option>Urgent</option>
                    <option>Maintenance</option>
                    <option>Billing</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Priority</label>
                <select class="form-select" name="priority">
                    <option>Normal</option>
                    <option>High</option>
                    <option>Urgent</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Expires at</label>
                <input class="form-control" type="date" name="expires_at" />
            </div>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="is_pinned" id="pinnedCheck" />
            <label class="form-check-label" for="pinnedCheck">Pin this notice</label>
        </div>
        <button class="btn btn-primary">Publish Notice</button>
    </form>
</div>
{% endblock %}
