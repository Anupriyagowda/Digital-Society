{% extends 'base.html' %}
{% block title %}Complaints{% endblock %}
{% block content %}
<div class="back-nav-shell mb-3">
    <button class="btn btn-sm btn-outline-secondary back-btn" type="button" data-fallback-url="{{ url_for('resident.index') }}">
        <i class="bi bi-arrow-left me-2"></i>Back
    </button>
</div>
<div class="card p-4">
    <h4>Complaint Center</h4>
    <ul class="list-group list-group-flush">
        {% for complaint in complaints %}
        <li class="list-group-item">{{ complaint.title }} - {{ complaint.status }} - {{ complaint.priority }}</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
