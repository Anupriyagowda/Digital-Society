{% extends 'base.html' %}
{% block title %}Complaints{% endblock %}
{% block content %}
<div class="back-nav-shell mb-3">
    <button class="btn btn-sm btn-outline-secondary back-btn" type="button" data-fallback-url="{{ url_for('main.dashboard') }}">
        <i class="bi bi-arrow-left me-2"></i>Back
    </button>
</div>
<div class="row g-4">
    <div class="col-lg-5">
        <div class="glass-card p-4">
            <h4 class="fw-bold mb-3">Submit complaint</h4>
            <form method="post" class="row g-3">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="col-12"><input class="form-control" name="title" placeholder="Title" required></div>
                <div class="col-12"><textarea class="form-control" name="description" placeholder="Description" rows="4" required></textarea></div>
                <div class="col-12"><button class="btn btn-primary">Submit</button></div>
            </form>
        </div>
    </div>
    <div class="col-lg-7">
        <div class="glass-card p-4">
            <h4 class="fw-bold mb-3">Your complaints</h4>
            <ul class="list-group list-group-flush">
                {% for complaint in complaints %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <a href="{{ url_for('resident.complaint_detail', complaint_id=complaint.id) }}">{{ complaint.title }}</a>
                    <span class="badge badge-soft">{{ complaint.status }}</span>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
{% endblock %}
