{% extends 'base.html' %}
{% block title %}Notice Board{% endblock %}
{% block content %}
<div class="back-nav-shell mb-3">
    <button class="btn btn-sm btn-outline-secondary back-btn" type="button" data-fallback-url="{{ url_for('resident.index') }}">
        <i class="bi bi-arrow-left me-2"></i>Back
    </button>
</div>
<div class="glass-card p-4">
    <h4 class="fw-bold mb-3">Society notices</h4>
    <ul class="list-group list-group-flush">
        {% for notice in notices %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ notice.title }}</span>
            <span class="badge badge-soft">{{ notice.notice_type }}</span>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
