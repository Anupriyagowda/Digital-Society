<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Digital Society</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body"{% if background_image %} style="background: linear-gradient(135deg, rgba(8, 30, 84, 0.78), rgba(11, 98, 163, 0.72)), url('{{ background_image }}') center/cover no-repeat fixed;"{% endif %}>
<div class="auth-page">
    <div class="container py-5">
        <div class="mb-3">
            <button class="btn btn-sm btn-outline-light back-btn" type="button" data-fallback-url="{{ url_for('auth.select_role', role_key='resident') }}">
                <i class="bi bi-arrow-left me-2"></i>Back
            </button>
        </div>
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="card-body p-4 p-lg-5">
                        <div class="text-center mb-4">
                            <div class="auth-form-logo mx-auto mb-3 d-flex align-items-center justify-content-center rounded-4 bg-primary text-white" style="width: 64px; height: 64px;">
                                <i class="bi bi-shield-lock-fill fs-3"></i>
                            </div>
                            <h3 class="fw-bold">Admin Login</h3>
                            <p class="text-muted mb-0">Access the society administration panel</p>
                        </div>
                        {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                            <div class="alert alert-{{ category }} py-2 small mb-3" role="alert">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                        {% endwith %}
                        <form method="post" class="mb-3" autocomplete="on">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                            <div class="mb-3">
                                <label class="form-label">Email or Username</label>
                                <div class="input-group input-group-lg shadow-sm rounded-4 overflow-hidden bg-light border border-1 border-secondary-subtle">
                                    <span class="input-group-text bg-transparent border-0"><i class="bi bi-envelope"></i></span>
                                    <input type="text" class="form-control border-0 bg-transparent" name="identifier" autocomplete="username" placeholder="admin" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <div class="input-group input-group-lg shadow-sm rounded-4 overflow-hidden bg-light border border-1 border-secondary-subtle">
                                    <span class="input-group-text bg-transparent border-0"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control border-0 bg-transparent" name="password" id="adminPassword" autocomplete="current-password" placeholder="Enter admin password" required>
                                    <button type="button" class="input-group-text bg-transparent border-0 text-secondary" id="toggleAdminPassword" aria-label="Show password" style="cursor: pointer;">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <button class="btn btn-primary btn-lg w-100 mb-3">Login as Admin</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const adminPassword = document.getElementById('adminPassword');
    const toggleAdminPassword = document.getElementById('toggleAdminPassword');
    if (adminPassword && toggleAdminPassword) {
        toggleAdminPassword.addEventListener('click', function () {
            const isPassword = adminPassword.type === 'password';
            adminPassword.type = isPassword ? 'text' : 'password';
            const icon = this.querySelector('i');
            icon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
            this.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });
    }
</script>
</body>
</html>
