<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Digital Society</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="back-nav-shell mb-3">
        <button class="btn btn-sm btn-outline-secondary back-btn" type="button" data-fallback-url="{{ url_for('main.index') }}">
            <i class="bi bi-arrow-left me-2"></i>Back
        </button>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <h3 class="mb-4">Forgot Password</h3>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'success' if category == 'info' else category }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" value="{{ request.form.email or '' }}" required>
                    </div>
                    <button class="btn btn-primary w-100">Send Reset Instructions</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    document.querySelectorAll('.back-btn').forEach((button) => {
        button.addEventListener('click', function (event) {
            event.preventDefault();
            const fallbackUrl = this.dataset.fallbackUrl || '{{ url_for('main.index') }}';
            if (window.history.length > 1) {
                window.history.back();
            } else if (fallbackUrl) {
                window.location.assign(fallbackUrl);
            } else {
                window.location.assign('/');
            }
        });
    });
</script>
</body>
</html>
